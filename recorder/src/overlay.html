<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YanLearn Recorder status</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
        user-select: none;
        -webkit-user-select: none;
      }

      #pill {
        position: absolute;
        right: 8px;
        bottom: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        border-radius: 999px;
        background: rgba(17, 18, 20, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        max-width: 340px;
      }

      #pill .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #9aa0a8;
        flex: none;
      }

      #pill.recording .dot {
        background: #ef4444;
        animation: blink 2.4s ease-in-out infinite;
      }

      #pill.paused .dot,
      #pill.forced .dot,
      #pill.attention .dot {
        background: #f59e0b;
      }

      #pill.armed .dot {
        background: #60a5fa;
      }

      #pill.uploading .dot {
        background: #22c55e;
      }

      #pill .title {
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #pill .detail {
        color: #c7cbd1;
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #banner {
        position: absolute;
        inset: 8px;
        border-radius: 16px;
        background: rgba(120, 12, 12, 0.94);
        border: 2px solid #ef4444;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 6px;
        padding: 12px 18px;
        animation: pulse 1.6s ease-in-out infinite;
      }

      #banner .title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      #banner .detail {
        font-size: 14px;
        color: #ffe4e6;
      }

      #identify {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border-radius: 28px;
        background: rgba(17, 18, 20, 0.9);
        border: 3px solid #fff;
        font-size: 120px;
        font-weight: 800;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.015);
        }
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="pill" hidden>
      <span class="dot"></span>
      <div>
        <div class="title" id="pill-title"></div>
        <div class="detail" id="pill-detail"></div>
      </div>
    </div>
    <div id="banner" hidden>
      <div class="title" id="banner-title"></div>
      <div class="detail" id="banner-detail"></div>
    </div>
    <div id="identify" hidden></div>

    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var identify = params.get("identify");
        if (identify) {
          var el = document.getElementById("identify");
          el.textContent = identify;
          el.hidden = false;
          return;
        }

        var current = null;

        function formatElapsed(sinceMs) {
          var total = Math.max(0, Math.floor((Date.now() - sinceMs) / 1000));
          var h = Math.floor(total / 3600);
          var m = Math.floor((total % 3600) / 60);
          var s = total % 60;
          var mm = (h > 0 ? String(m).padStart(2, "0") : String(m)) + ":" + String(s).padStart(2, "0");
          return h > 0 ? h + ":" + mm : mm;
        }

        function formatCountdown(untilMs) {
          var total = Math.max(0, Math.ceil((untilMs - Date.now()) / 1000));
          var m = Math.floor(total / 60);
          var s = total % 60;
          return m + ":" + String(s).padStart(2, "0");
        }

        function render() {
          var pill = document.getElementById("pill");
          var banner = document.getElementById("banner");
          if (!current || current.mode === "hidden") {
            pill.hidden = true;
            banner.hidden = true;
            return;
          }
          var title = current.title || "";
          if (current.recordingSinceMs) {
            title = title.replace("{elapsed}", formatElapsed(current.recordingSinceMs));
          }
          if (current.countdownToMs) {
            title = title.replace("{countdown}", formatCountdown(current.countdownToMs));
          }
          var detail = current.detail || "";
          if (current.blocking) {
            pill.hidden = true;
            banner.hidden = false;
            document.getElementById("banner-title").textContent = title;
            document.getElementById("banner-detail").textContent = detail;
          } else {
            banner.hidden = true;
            pill.hidden = false;
            pill.className = current.mode;
            document.getElementById("pill-title").textContent = title;
            var detailEl = document.getElementById("pill-detail");
            detailEl.textContent = detail;
            detailEl.hidden = !detail;
          }
        }

        function apply(state) {
          current = state && typeof state === "object" ? state : null;
          render();
        }

        // Cheap one-second tick only refreshes the elapsed/countdown text.
        setInterval(function () {
          if (current && (current.recordingSinceMs || current.countdownToMs)) {
            render();
          }
        }, 1000);

        var tauri = window.__TAURI__;
        if (tauri) {
          tauri.core.invoke("get_overlay_state").then(apply).catch(function () {});
          tauri.event.listen("overlay-state", function (event) {
            apply(event.payload);
          });
        }
      })();
    </script>
  </body>
</html>
