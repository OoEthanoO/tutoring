<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YanLearn Recorder status</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
        user-select: none;
        -webkit-user-select: none;
      }

      /* The pill fills its window, which is sized to fit it: every pixel of
         that window takes mouse input, and any spare is a pixel of the lesson
         the tutor cannot click. */
      #pill {
        position: absolute;
        left: 0;
        top: 0;
        cursor: grab;
      }

      #pill.dragging {
        cursor: grabbing;
      }

      /* Drop targets, shown only while the pill is held. */
      .guide {
        position: absolute;
        box-sizing: border-box;
        border: 2px dashed rgba(255, 255, 255, 0.9);
        border-radius: 999px;
        background: rgba(17, 18, 20, 0.28);
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.45), inset 0 0 0 2px rgba(0, 0, 0, 0.35);
      }
      #pill {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        border-radius: 999px;
        background: rgba(17, 18, 20, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        max-width: 340px;
      }

      #pill .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #9aa0a8;
        flex: none;
      }

      #pill.recording .dot {
        background: #ef4444;
        animation: blink 2.4s ease-in-out infinite;
      }

      #pill.paused .dot,
      #pill.forced .dot,
      #pill.attention .dot {
        background: #f59e0b;
      }

      #pill.armed .dot {
        background: #60a5fa;
      }

      #pill.uploading .dot {
        background: #22c55e;
      }

      #pill .title {
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #pill .detail {
        color: #c7cbd1;
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #banner {
        position: absolute;
        inset: 8px;
        border-radius: 16px;
        background: rgba(120, 12, 12, 0.94);
        border: 2px solid #ef4444;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 6px;
        padding: 12px 18px;
        animation: pulse 1.6s ease-in-out infinite;
      }

      #banner .title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      #banner .detail {
        font-size: 14px;
        color: #ffe4e6;
      }

      #identify {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border-radius: 28px;
        background: rgba(17, 18, 20, 0.9);
        border: 3px solid #fff;
        font-size: 120px;
        font-weight: 800;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.015);
        }
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="pill" hidden>
      <span class="dot"></span>
      <div>
        <div class="title" id="pill-title"></div>
        <div class="detail" id="pill-detail"></div>
      </div>
    </div>
    <div id="banner" hidden>
      <div class="title" id="banner-title"></div>
      <div class="detail" id="banner-detail"></div>
    </div>
    <div id="identify" hidden></div>
    <div id="guides"></div>

    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var identify = params.get("identify");
        if (identify) {
          var el = document.getElementById("identify");
          el.textContent = identify;
          el.hidden = false;
          return;
        }

        // A transparent sheet over the whole display, showing where the pill
        // can be dropped. Only ever visible while it is being held.
        if (params.get("guides")) {
          var guideBox = document.getElementById("guides");
          var drawGuides = function (spec) {
            var width = Math.max(40, Number(spec && spec.width) || 280);
            var height = Math.max(24, Number(spec && spec.height) || 44);
            var margin = Number(spec && spec.margin) || 16;
            var bottom = Number(spec && spec.bottomMargin) || 72;
            var corners = [
              { left: margin, top: margin },
              { right: margin, top: margin },
              { left: margin, bottom: bottom },
              { right: margin, bottom: bottom },
            ];
            guideBox.innerHTML = "";
            for (var i = 0; i < corners.length; i++) {
              var guide = document.createElement("div");
              guide.className = "guide";
              guide.style.width = width + "px";
              guide.style.height = height + "px";
              for (var edge in corners[i]) {
                guide.style[edge] = corners[i][edge] + "px";
              }
              guideBox.appendChild(guide);
            }
          };
          drawGuides(null);
          if (window.__TAURI__) {
            // Sent on every drag: the pill's size changes with its text, and
            // the outlines have to match the thing being dragged.
            window.__TAURI__.event.listen("corner-guides", function (event) {
              drawGuides(event.payload);
            });
          }
          return;
        }

        var current = null;

        function formatElapsed(sinceMs) {
          var total = Math.max(0, Math.floor((Date.now() - sinceMs) / 1000));
          var h = Math.floor(total / 3600);
          var m = Math.floor((total % 3600) / 60);
          var s = total % 60;
          var mm = (h > 0 ? String(m).padStart(2, "0") : String(m)) + ":" + String(s).padStart(2, "0");
          return h > 0 ? h + ":" + mm : mm;
        }

        function formatCountdown(untilMs) {
          var total = Math.max(0, Math.ceil((untilMs - Date.now()) / 1000));
          var m = Math.floor(total / 60);
          var s = total % 60;
          return m + ":" + String(s).padStart(2, "0");
        }

        function render() {
          var pill = document.getElementById("pill");
          var banner = document.getElementById("banner");
          if (!current || current.mode === "hidden") {
            pill.hidden = true;
            banner.hidden = true;
            return;
          }
          var title = current.title || "";
          if (current.recordingSinceMs) {
            title = title.replace("{elapsed}", formatElapsed(current.recordingSinceMs));
          }
          if (current.countdownToMs) {
            title = title.replace("{countdown}", formatCountdown(current.countdownToMs));
          }
          var detail = current.detail || "";
          if (current.blocking) {
            pill.hidden = true;
            banner.hidden = false;
            document.getElementById("banner-title").textContent = title;
            document.getElementById("banner-detail").textContent = detail;
          } else {
            banner.hidden = true;
            pill.hidden = false;
            pill.className = current.mode;
            document.getElementById("pill-title").textContent = title;
            var detailEl = document.getElementById("pill-detail");
            detailEl.textContent = detail;
            detailEl.hidden = !detail;
          }
        }

        function apply(state) {
          current = state && typeof state === "object" ? state : null;
          render();
          syncSize();
        }

        // Cheap one-second tick only refreshes the elapsed/countdown text.
        setInterval(function () {
          if (current && (current.recordingSinceMs || current.countdownToMs)) {
            render();
          }
        }, 1000);

        var tauri = window.__TAURI__;
        if (tauri) {
          tauri.core.invoke("get_overlay_state").then(apply).catch(function () {});
          tauri.event.listen("overlay-state", function (event) {
            apply(event.payload);
          });
        }

        // Dragging the pill between corners. The window follows the pointer and
        // lands in whichever corner it was nearest when let go.
        var dragPill = document.getElementById("pill");
        var lastWidth = 0;
        var lastHeight = 0;
        var dragging = false;

        // The window is sized to the pill, because it is the one overlay that
        // takes mouse input: every pixel of it that is not the pill is a pixel
        // of the lesson the tutor cannot click.
        function syncSize() {
          if (!tauri || !current || current.blocking || dragPill.hidden) {
            return;
          }
          var rect = dragPill.getBoundingClientRect();
          var width = Math.ceil(rect.width);
          var height = Math.ceil(rect.height);
          if (!width || !height) {
            return;
          }
          if (Math.abs(width - lastWidth) < 2 && Math.abs(height - lastHeight) < 2) {
            return;
          }
          lastWidth = width;
          lastHeight = height;
          tauri.core.invoke("resize_overlay", { width: width, height: height }).catch(function () {});
        }

        function endDrag(event) {
          if (!dragging) {
            return;
          }
          dragging = false;
          dragPill.classList.remove("dragging");
          if (event && event.pointerId !== undefined) {
            try {
              dragPill.releasePointerCapture(event.pointerId);
            } catch (error) {
              // already released
            }
          }
          tauri.core.invoke("hide_corner_guides").catch(function () {});
          tauri.core.invoke("snap_overlay").catch(function () {});
        }

        dragPill.addEventListener("pointerdown", function (event) {
          if (event.button !== 0 || !tauri) {
            return;
          }
          dragging = true;
          dragPill.classList.add("dragging");
          // Capture keeps the moves coming when the pointer outruns the window,
          // which it does on any quick drag.
          try {
            dragPill.setPointerCapture(event.pointerId);
          } catch (error) {
            // not fatal; the drag just ends if the pointer leaves
          }
          var rect = dragPill.getBoundingClientRect();
          tauri.core
            .invoke("show_corner_guides", {
              width: Math.ceil(rect.width),
              height: Math.ceil(rect.height),
            })
            .catch(function () {});
          event.preventDefault();
        });

        dragPill.addEventListener("pointermove", function (event) {
          if (!dragging || (!event.movementX && !event.movementY)) {
            return;
          }
          tauri.core
            .invoke("nudge_overlay", { dx: event.movementX, dy: event.movementY })
            .catch(function () {});
        });

        dragPill.addEventListener("pointerup", endDrag);
        dragPill.addEventListener("pointercancel", endDrag);
      })();
    </script>
  </body>
</html>
