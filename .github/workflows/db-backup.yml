name: Database Backup

on:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      timestamp: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Backup Timestamp
        id: vars
        run: echo "timestamp=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      - name: Run pg_dump
        env:
          # Ensure you set this secret in your GitHub repository
          # Format: postgresql://postgres:[PASSWORD]@[HOST]:[PORT]/postgres
          DATABASE_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Error: PROD_DB_URL secret is not set!"
            exit 1
          fi
          
          # Run pg_dump from a PostgreSQL 17 container so the client matches the server.
          BACKUP_FILE="backup_${{ env.timestamp }}.dump"
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -e BACKUP_FILE="$BACKUP_FILE" \
            -v "$PWD:/backup" \
            postgres:17 \
            bash -lc 'pg_dump "$DATABASE_URL" \
              --clean \
              --if-exists \
              --no-owner \
              --no-privileges \
              --schema=public \
              --schema=auth \
              --schema=storage \
              -F c > "/backup/$BACKUP_FILE"'
          
          echo "Database dump created successfully."

      - name: Upload Backup as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ env.timestamp }}
          path: backup_${{ env.timestamp }}.dump
          retention-days: 90 # Maximum allowed by GitHub for free
          
      - name: Cleanup
        run: echo "Backup uploaded to GitHub Artifacts successfully."
