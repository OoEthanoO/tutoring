name: Temporary encrypted scheduler configuration transfer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt the existing scheduler configuration for finprint-host
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REMINDER_ENDPOINT_URL: ${{ secrets.REMINDER_ENDPOINT_URL }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          if (!process.env.CRON_SECRET) throw new Error('Scheduler credential is missing');
          const publicKey = Buffer.from('', 'base64');
          const key = crypto.randomBytes(32), iv = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
          const data = Buffer.concat([cipher.update(JSON.stringify({CRON_SECRET: process.env.CRON_SECRET, REMINDER_ENDPOINT_URL: process.env.REMINDER_ENDPOINT_URL || ''})), cipher.final()]);
          const wrapped = crypto.publicEncrypt({key: publicKey, oaepHash: 'sha256'}, key);
          fs.writeFileSync('scheduler.enc.json', JSON.stringify({key:wrapped.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')}));
          key.fill(0);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-scheduler-configuration
          path: scheduler.enc.json
          retention-days: 1
